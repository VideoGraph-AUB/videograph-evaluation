[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videograph-evaluation"
version = "1.0.0"
description = "Benchmark evaluation pipeline for VideoGraph."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
  "videograph-core>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["videograph_eval*"]

[project.scripts]
videograph-eval = "videograph_eval.run:main"

